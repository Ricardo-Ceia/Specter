<!DOCTYPE html>
<html>
  <head>
    <title>Specter</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <h1>Specter</h1>
    <canvas id="barChart" style="max-width:800px;"></canvas> 
    <script>
      let barChart;

      function formatTime(seconds) {
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = seconds % 60;
        return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
      }

      function initChart(){
        const ctx = document.getElementById('barChart').getContext('2d');
        barChart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: [],
            datasets: [{
              label: 'Time (seconds)',
              data: [],
              backgroundColor: 'rgba(75,192,192,0.6)'
            }]
          },
          options: {
            plugins: {
              legend: {
                position: 'bottom'
              },
              tooltip: {
                callbacks: {
                  label: (ctx) => formatTime(ctx.parsed.x)
                }
              }
            },
            scales: {
              x: {
                title: {
                  display: true,
                  text: 'Seconds'
                },
                ticks: {
                  callback: (value) => formatTime(value)  // Format x-axis labels
                }
              }
            },
            responsive: true,
            indexAxis: 'y'
          }
        })
      }

      function updateChart(data){
        const sorted = Object.entries(data).sort((a,b)=>b[1]-a[1]);

        barChart.data.labels = sorted.map(([terminal])=>terminal);
        barChart.data.datasets[0].data = sorted.map(([,seconds])=>seconds);
        barChart.update();
      }

      const eventSource = new EventSource('/events');
      eventSource.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if(!barChart) initChart();
        updateChart(data);
      };
    </script>
  </body>
</html>
